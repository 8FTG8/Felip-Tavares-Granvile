# Reproduz em produção o arranjo que o `vite.config.ts` monta em desenvolvimento: o
# estático e a API na mesma origem, o que dispensa CORS. A interface chama `/api/...` nos
# dois ambientes, e nenhuma URL muda entre eles.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A barra final em `proxy_pass` remove o prefixo `/api/` do caminho encaminhado —
    # equivalente ao `rewrite` do proxy do Vite. Sem ela, a API receberia `/api/sistema`.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A resposta do chat é transmitida em partes: sem desligar o buffer, o nginx
        # acumularia o corpo inteiro e entregaria de uma vez, anulando o efeito de ver o
        # texto surgindo — que é o que torna aceitável a espera da geração em CPU.
        proxy_buffering off;
        proxy_cache off;

        # A geração em CPU leva de 30 s a 2 min conforme o modelo. O padrão de 60 s
        # cortaria a resposta no meio.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Cadastro de procedimento em PDF.
        client_max_body_size 25m;
    }

    # Aplicação de página única: qualquer rota desconhecida devolve o index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
