<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manutenção Prescritiva — SENAI SC</title>
    <meta
      name="description"
      content="Localiza ocorrências semelhantes no histórico de sensores e prescreve a ação corretiva com base na documentação técnica da empresa."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Ícones em traço, no mesmo peso do texto — acompanham o rótulo sem dominá-lo. */
      .material-symbols-outlined {
        font-family: "Material Symbols Outlined";
        font-weight: normal;
        font-style: normal;
        line-height: 1;
        display: inline-block;
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 20;
      }
    </style>
  </head>
  <body>
    <script>
      // Aplica o tema antes do primeiro pixel: sem isto, o tema claro pisca por um quadro
      // antes de o React montar e corrigir.
      (function () {
        var salvo = localStorage.getItem("tema");
        var escuro =
          salvo === "escuro" ||
          (!salvo && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.tema = escuro ? "escuro" : "claro";
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
